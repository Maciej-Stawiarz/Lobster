services:
  database:
    image: postgres:18
    container_name: postgres_database
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME}
    ports:
      - "${POSTGRES_DATABASE_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: